name: Build HBC

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    name: Build using devkitPPC via Docker
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt update && \
        sudo apt install -y gcc sox gettext libpng-dev xxd python3-pip
        python3 -m pip install --break-system-packages pycryptodome
    - name: Build WiiPAX
      run: |
        cd wiipax
        make
    - name: Build HBC
      run: |
        cd channel
        make
    - name: Build standalone DOL candidate from uncompressed app ELF
      run: |
        cd channel/channelapp
        \${DEVKITPRO}/tools/bin/elf2dol channelapp_nopax.elf wupc-test.dol
        python3 - <<'PY'
        import struct
        elf = open("channelapp_nopax.elf", "rb").read()
        dol = bytearray(open("wupc-test.dol", "rb").read())
        assert elf[:4] == bytes((127, 69, 76, 70))
        assert elf[4] == 1 and elf[5] == 2, "Expected big-endian ELF32"
        phoff = struct.unpack_from(">I", elf, 28)[0]
        phentsize = struct.unpack_from(">H", elf, 42)[0]
        phnum = struct.unpack_from(">H", elf, 44)[0]
        bss_regions = []
        for i in range(phnum):
            off = phoff + i * phentsize
            p_type, p_offset, p_vaddr, p_paddr, p_filesz, p_memsz, p_flags, p_align = struct.unpack_from(">8I", elf, off)
            if p_type == 1 and (p_flags & 2) and p_memsz > p_filesz:
                bss_regions.append((p_vaddr + p_filesz, p_memsz - p_filesz))
        assert len(bss_regions) == 1, f"Expected one trailing writable BSS region, got {bss_regions}"
        bss_addr, bss_size = bss_regions[0]
        struct.pack_into(">I", dol, 0xD8, bss_addr)
        struct.pack_into(">I", dol, 0xDC, bss_size)
        with open("wupc-test.dol", "wb") as f:
            f.write(dol)
        print("DOL BSS:", hex(bss_addr), "+", hex(bss_size))
        PY
    - name: Publish WAD
      uses: actions/upload-artifact@v4
      with:
        path: "channel/title/channel_retail.wad"
        name: The Homebrew Channel
    - name: Publish standalone DOL candidate
      uses: actions/upload-artifact@v4
      with:
        path: "channel/channelapp/wupc-test.dol"
        name: HBC WUPC standalone candidate

    - name: Inspect standalone build inputs
      run: |
        cd channel/channelapp
        ${DEVKITPPC}/bin/powerpc-eabi-readelf -h -l -S channelapp_nopax.elf > hbc-elf-report.txt
        ${DEVKITPRO}/tools/bin/elf2dol channelapp_nopax.elf wupc-test.dol
        python3 - <<'PY'
        import struct
        p = "wupc-test.dol"
        b = open(p, "rb").read(0x100)
        entry = struct.unpack_from(">I", b, 0xE0)[0]
        text = [(struct.unpack_from(">I", b, i)[0], struct.unpack_from(">I", b, 0x48+i)[0], struct.unpack_from(">I", b, 0x90+i)[0]) for i in range(0, 0x1c, 4)]
        data = [(struct.unpack_from(">I", b, 0x1c+i)[0], struct.unpack_from(">I", b, 0x64+i)[0], struct.unpack_from(">I", b, 0xac+i)[0]) for i in range(0, 0x1c, 4)]
        segs = [(off, addr, size) for off, addr, size in text+data if off and size]
        print("DOL entry:", hex(entry))
        print("DOL load segments:", [(hex(o), hex(a), hex(s)) for o,a,s in segs])
        assert entry == 0x81330000, "Unexpected DOL entry point"
        assert any(addr == entry for _,addr,_ in segs), "Entry point is not in a load segment"
        assert len(segs) > 1, "Expected multiple native DOL segments, not a single packed loader segment"
        bss_addr, bss_size = struct.unpack_from(">II", open(p, "rb").read(0x100), 0xD8)
        assert bss_addr == 0x815A3D40 and bss_size == 0x93E80, "Unexpected BSS range"
        print("DOL BSS:", hex(bss_addr), hex(bss_size))
        PY
        ${DEVKITPPC}/bin/powerpc-eabi-readelf -h -l -S channelapp-channel.elf > hbc-channel-elf-report.txt
        ${DEVKITPPC}/bin/powerpc-eabi-size channelapp_nopax.elf channelapp.elf channelapp-channel.elf > hbc-size-report.txt
        ls -lh channelapp_nopax.elf channelapp.elf channelapp-channel.elf wupc-test.dol channelapp.map > hbc-file-report.txt
    - name: Publish build diagnostics
      uses: actions/upload-artifact@v4
      with:
        path: |
          channel/channelapp/channelapp_nopax.elf
          channel/channelapp/channelapp.elf
          channel/channelapp/channelapp-channel.elf
          channel/channelapp/wupc-test.dol
          channel/channelapp/channelapp.map
          channel/channelapp/hbc-elf-report.txt
          channel/channelapp/hbc-channel-elf-report.txt
          channel/channelapp/hbc-size-report.txt
          channel/channelapp/hbc-file-report.txt
        name: HBC build diagnostics
